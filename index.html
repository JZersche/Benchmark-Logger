<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark Logger</title>
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>

<body>
  <h1>Benchmark Logger</h1>

  <form id="groupForm" class="controls" novalidate>
    <h2 id="formTitle">Add Benchmark Group</h2>

    <div id="predefinedGroups">
      <label for="predefinedGroupSelect">Predefined group:</label>
      <select id="predefinedGroupSelect">
        <option value="">-- Select Predefined Group --</option>
        <option value="MemoryMark">MemoryMark</option>
        <option value="CPUMark">CPUMark</option>
        <option value="TestMark">Test Benchmark</option>
      </select>
    </div>

    <div class="field-row">
      <label class="field grow">Benchmark name
        <input id="groupName" placeholder="e.g. MemoryMark" autocomplete="off" required />
      </label>
      <label class="field">Overall score (optional)
        <input id="groupValue" type="number" step="any" inputmode="decimal" />
      </label>
    </div>

    <label class="field">Note (optional)
      <input id="groupNote" autocomplete="off" />
    </label>

    <div class="field-row">
      <label class="field">XMP (optional)
        <input id="groupXMP" placeholder="e.g. Enabled" autocomplete="off" />
      </label>
      <label class="field">tRAS (optional)
        <input id="groupTRAS" type="number" step="1" min="0" inputmode="numeric" />
      </label>
    </div>

    <h3>Metrics</h3>
    <div id="metricsContainer" class="metrics"></div>
    <div>
      <button type="button" id="addMetricBtn">Add Metric</button>
    </div>

    <p id="formError" class="form-error" role="alert" hidden></p>

    <div class="form-actions">
      <button type="submit" id="submitBtn">Add Group to Graph</button>
      <button type="button" id="cancelEditBtn" class="button-quiet" hidden>Cancel Edit</button>
    </div>
  </form>

  <section class="toolbar" aria-label="Import and export">
    <button type="button" id="exportJsonBtn">Export JSON</button>
    <button type="button" id="exportCsvBtn">Export CSV</button>
    <label class="file-button">Import JSON/CSV
      <input type="file" id="importInput" accept=".json,.csv,application/json,text/csv" />
    </label>
    <span id="status" class="status" role="status"></span>
  </section>

  <section id="comparison" class="comparison" aria-labelledby="comparisonTitle" hidden>
    <div class="comparison-header">
      <h2 id="comparisonTitle">Comparison</h2>
      <button type="button" id="clearCompareBtn" class="button-quiet">Clear Selection</button>
    </div>
    <div id="comparisonBody"></div>
  </section>

  <section class="graph" id="graph" aria-label="Logged benchmarks"></section>
</body>
</html>
